<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" role="img">
<title>随机森林：树数对准确率的影响</title>
<rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
<text x="16" y="26" font-family="system-ui,sans-serif" font-size="14" fill="#2c2c2a">随机森林：树数对准确率的影响</text>
<line x1="50" x2="696" y1="280.0" y2="280.0" stroke="#e3e1da"/>
<text x="46" y="284.0" font-family="system-ui,sans-serif" font-size="11" fill="#888780" text-anchor="end">0</text>
<line x1="50" x2="696" y1="222.0" y2="222.0" stroke="#e3e1da"/>
<text x="46" y="226.0" font-family="system-ui,sans-serif" font-size="11" fill="#888780" text-anchor="end">0.235</text>
<line x1="50" x2="696" y1="164.0" y2="164.0" stroke="#e3e1da"/>
<text x="46" y="168.0" font-family="system-ui,sans-serif" font-size="11" fill="#888780" text-anchor="end">0.471</text>
<line x1="50" x2="696" y1="106.0" y2="106.0" stroke="#e3e1da"/>
<text x="46" y="110.0" font-family="system-ui,sans-serif" font-size="11" fill="#888780" text-anchor="end">0.706</text>
<line x1="50" x2="696" y1="48.0" y2="48.0" stroke="#e3e1da"/>
<text x="46" y="52.0" font-family="system-ui,sans-serif" font-size="11" fill="#888780" text-anchor="end">0.942</text>
<rect x="73.6" y="53.8" width="124.8" height="226.2" fill="#185fa5"/>
<text x="136.0" y="298" font-family="system-ui,sans-serif" font-size="11" fill="#5f5e5a" text-anchor="middle">breast_cancer/决策树(单棵)</text>
<rect x="233.6" y="50.9" width="124.8" height="229.1" fill="#185fa5"/>
<text x="296.0" y="298" font-family="system-ui,sans-serif" font-size="11" fill="#5f5e5a" text-anchor="middle">breast_cancer/随机森林(10棵)</text>
<rect x="393.6" y="49.4" width="124.8" height="230.6" fill="#185fa5"/>
<text x="456.0" y="298" font-family="system-ui,sans-serif" font-size="11" fill="#5f5e5a" text-anchor="middle">breast_cancer/随机森林(100棵)</text>
<rect x="553.6" y="48.0" width="124.8" height="232.0" fill="#185fa5"/>
<text x="616.0" y="298" font-family="system-ui,sans-serif" font-size="11" fill="#5f5e5a" text-anchor="middle">breast_cancer/随机森林(300棵)</text>
<line x1="50" x2="696" y1="280" y2="280" stroke="#b4b2a9"/>
<rect x="50" y="314" width="10" height="10" fill="#185fa5"/>
<text x="64" y="322" font-family="system-ui,sans-serif" font-size="11" fill="#5f5e5a">测试准确率</text>
<text x="14" y="40" font-family="system-ui,sans-serif" font-size="11" fill="#888780">准确率</text>
