<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" role="img">
<title>回归模型测试集 RMSE 对比</title>
<rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
<text x="16" y="26" font-family="system-ui,sans-serif" font-size="14" fill="#2c2c2a">回归模型测试集 RMSE 对比</text>
<line x1="50" x2="696" y1="280.0" y2="280.0" stroke="#e3e1da"/>
<text x="46" y="284.0" font-family="system-ui,sans-serif" font-size="11" fill="#888780" text-anchor="end">0</text>
<line x1="50" x2="696" y1="222.0" y2="222.0" stroke="#e3e1da"/>
<text x="46" y="226.0" font-family="system-ui,sans-serif" font-size="11" fill="#888780" text-anchor="end">0.115</text>
<line x1="50" x2="696" y1="164.0" y2="164.0" stroke="#e3e1da"/>
<text x="46" y="168.0" font-family="system-ui,sans-serif" font-size="11" fill="#888780" text-anchor="end">0.23</text>
<line x1="50" x2="696" y1="106.0" y2="106.0" stroke="#e3e1da"/>
<text x="46" y="110.0" font-family="system-ui,sans-serif" font-size="11" fill="#888780" text-anchor="end">0.345</text>
<line x1="50" x2="696" y1="48.0" y2="48.0" stroke="#e3e1da"/>
<text x="46" y="52.0" font-family="system-ui,sans-serif" font-size="11" fill="#888780" text-anchor="end">0.461</text>
<rect x="67.7" y="48.4" width="83.2" height="231.6" fill="#185fa5"/>
<text x="109.3" y="298" font-family="system-ui,sans-serif" font-size="11" fill="#5f5e5a" text-anchor="middle">线性回归 OLS</text>
<rect x="174.4" y="48.4" width="83.2" height="231.6" fill="#185fa5"/>
<text x="216.0" y="298" font-family="system-ui,sans-serif" font-size="11" fill="#5f5e5a" text-anchor="middle">Ridge(alpha=1)</text>
<rect x="281.1" y="48.0" width="83.2" height="232.0" fill="#185fa5"/>
<text x="322.7" y="298" font-family="system-ui,sans-serif" font-size="11" fill="#5f5e5a" text-anchor="middle">Lasso(alpha=0.01)</text>
<rect x="387.7" y="188.1" width="83.2" height="91.9" fill="#185fa5"/>
<text x="429.3" y="298" font-family="system-ui,sans-serif" font-size="11" fill="#5f5e5a" text-anchor="middle">多项式回归(2阶)</text>
<rect x="494.4" y="122.5" width="83.2" height="157.5" fill="#185fa5"/>
<text x="536.0" y="298" font-family="system-ui,sans-serif" font-size="11" fill="#5f5e5a" text-anchor="middle">决策树(max_depth=5)</text>
<rect x="601.1" y="168.7" width="83.2" height="111.3" fill="#185fa5"/>
<text x="642.7" y="298" font-family="system-ui,sans-serif" font-size="11" fill="#5f5e5a" text-anchor="middle">随机森林(200)</text>
<line x1="50" x2="696" y1="280" y2="280" stroke="#b4b2a9"/>
<rect x="50" y="314" width="10" height="10" fill="#185fa5"/>
<text x="64" y="322" font-family="system-ui,sans-serif" font-size="11" fill="#5f5e5a">RMSE</text>
<text x="14" y="40" font-family="system-ui,sans-serif" font-size="11" fill="#888780">RMSE（表面粗糙度）</text>
</svg>