<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" role="img">
<title>自注意力权重对比（相似 vs 无关 token）</title>
<rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
<text x="16" y="26" font-family="system-ui,sans-serif" font-size="14" fill="#2c2c2a">自注意力权重对比（相似 vs 无关 token）</text>
<line x1="50" x2="696" y1="280.0" y2="280.0" stroke="#e3e1da"/>
<text x="46" y="284.0" font-family="system-ui,sans-serif" font-size="11" fill="#888780" text-anchor="end">0</text>
<line x1="50" x2="696" y1="222.0" y2="222.0" stroke="#e3e1da"/>
<text x="46" y="226.0" font-family="system-ui,sans-serif" font-size="11" fill="#888780" text-anchor="end">0.015</text>
<line x1="50" x2="696" y1="164.0" y2="164.0" stroke="#e3e1da"/>
<text x="46" y="168.0" font-family="system-ui,sans-serif" font-size="11" fill="#888780" text-anchor="end">0.031</text>
<line x1="50" x2="696" y1="106.0" y2="106.0" stroke="#e3e1da"/>
<text x="46" y="110.0" font-family="system-ui,sans-serif" font-size="11" fill="#888780" text-anchor="end">0.046</text>
<line x1="50" x2="696" y1="48.0" y2="48.0" stroke="#e3e1da"/>
<text x="46" y="52.0" font-family="system-ui,sans-serif" font-size="11" fill="#888780" text-anchor="end">0.061</text>
<rect x="91.2" y="48.0" width="249.6" height="232.0" fill="#185fa5"/>
<text x="216.0" y="298" font-family="system-ui,sans-serif" font-size="11" fill="#5f5e5a" text-anchor="middle">相似 token 对</text>
<rect x="411.2" y="142.1" width="249.6" height="137.9" fill="#185fa5"/>
<text x="536.0" y="298" font-family="system-ui,sans-serif" font-size="11" fill="#5f5e5a" text-anchor="middle">无关 token 对</text>
<line x1="50" x2="696" y1="280" y2="280" stroke="#b4b2a9"/>
<rect x="50" y="314" width="10" height="10" fill="#185fa5"/>
<text x="64" y="322" font-family="system-ui,sans-serif" font-size="11" fill="#5f5e5a">平均注意力权重</text>
<text x="14" y="40" font-family="system-ui,sans-serif" font-size="11" fill="#888780">权重</text>
</svg>